# saneland — which new windows get auto-maximized.
#
# hypr-max-on-open consults this when a window opens and there is no
# remembered geometry for its class yet. One rule per line:
#
#     <keyword>   <regex>
#
#     always   maximize it — fill the work area of the monitor it opened on
#     leave    never auto-maximize; the window keeps the size it asked for
#              (its geometry is still remembered when you resize or close it)
#     never    don't touch it at all, and never remember its geometry
#
#     multi    every window of this class is a real main window — exempt it
#              from ONE WINDOW AT A TIME below
#     popup    a window TITLE that is never a main window (only consulted for
#              `multi` classes, as the exception list to their exemption)
#
# The first three answer "may this be maximized" and match the class; the last
# two answer "is this a main window" and match the class and the title
# respectively. A class can have one of each.
#
# FIRST MATCH WINS, and window-policy.local.conf is read before this file, so
# a rule of yours always beats a default here. A trailing `# comment` is
# stripped; the regex may contain spaces (^Tor Browser$ is fine).
#
# The regex is matched against the window's class — its Wayland app_id — with
# bash `=~`, so anchor it: `^kitty$`, not `kitty`. To find a class, run
# `hyprctl clients | grep class`; to find out which line below is deciding,
# focus the window and run `hypr-window-policy show`.
#
# --------------------------------------------------------------------------
# ONE WINDOW AT A TIME
# --------------------------------------------------------------------------
# A verdict here — and a remembered geometry, which outranks it — is only ever
# applied to a window that is the ONLY ONE of its class at the moment it opens.
# A second window of an app is a dialog far more often than it is a second main
# window (GIMP's Export As and Preferences, Thunderbird's event details), and
# nothing in the Wayland protocol says which it is, so the second one is left
# exactly as it asked to be. mod+m sizes the ones that get left alone, and
# mod+Alt+Shift+m remembers a size you set up that way. Remembering is gated the
# same way, so a dialog can never overwrite the size of the app's real window.
#
# `multi` is the exemption, for apps where that reading is simply wrong. A
# browser's windows are all real main windows: you keep four open, and under the
# rule above not one of them could be sized on open or remembered on close,
# because none is ever alone. A `multi` class is treated as if every window were
# the only one — sized when it opens, remembered when it closes.
#
# `popup` is the price of that exemption. A browser DOES have windows that
# aren't browsing windows, wearing the same class: Picture-in-Picture, the
# bookmarks Library, an extension detached into its own window. Those must not
# be maximized on open, and — the bug that made this list necessary in the first
# place — must not be REMEMBERED, or they overwrite the real window's size just
# by closing after it. A detached Bitwarden popup did exactly that: it left
# waterfox.json holding a centred 1152x744 and every browser start came back
# that size. Titles are the only thing that separates them, so the titles are
# listed, as data you can edit rather than a rule in the code.
#
# Only add `multi` for an app whose windows really are interchangeable. Anything
# not listed keeps the safe reading, which needs no per-app knowledge at all.
#
# --------------------------------------------------------------------------
# WHY NOT LISTED = LEAVE ALONE
# --------------------------------------------------------------------------
# There is no way to ask a Wayland client "are you a dialog?". Hyprland
# exposes no parent window, no window type and no size hints in `hyprctl
# clients`, and its windowrules can't match on any of them either (xdgTag and
# contentType exist in the JSON but `match:xdgTag` is rejected as an invalid
# field). The X11 answers — _NET_WM_WINDOW_TYPE, WM_TRANSIENT_FOR,
# WM_NORMAL_HINTS — only exist for XWayland windows, which is almost nothing
# these days.
#
# So any rule of the form "maximize it if it looks big enough" is guessing,
# and it guesses wrong in the direction that hurts: this config used to
# maximize the first window of every class, which meant a password prompt or
# a file chooser could open filling the screen. Opening an unknown app at the
# size it asked for is a much smaller annoyance, and it corrects itself the
# first time you resize the window — the size is remembered per class from
# then on.
#
# Teach it an app instead of widening a heuristic: focus a window and press
# mod+Alt+m (or run `hypr-window-policy always`) and it lands in your local
# file. `hypr-window-policy list` shows the whole effective table.
#
# --------------------------------------------------------------------------

# --- Never touch -----------------------------------------------------------
# Tor Browser: window dimensions feed browser fingerprinting, so its size is
# the browser's business. `never` also means we never persist its geometry.
never   ^Tor Browser$

# --- Dialogs, prompts and pickers -----------------------------------------
# Unlisted classes are left alone anyway; these are spelled out so the intent
# is on the record, and so that a family pattern further down can never
# swallow one of them by accident.
leave   ^gcr-prompter$                          # GNOME keyring password prompt
leave   ^(hyprland-dialog|hyprland-donate-screen|hyprland-share-picker)$
leave   ^xdg-desktop-portal-.*$                 # portal file chooser / screen share
leave   ^(nm-applet|nm-connection-editor)$
leave   ^pinentry-.*$
leave   ^(polkit-.*|.*polkit-agent)$
# Sized and centred by a `windowrule = size` in hyprland.conf instead — both
# spellings, because the Wayland app_ids are org.pulseaudio.pavucontrol and
# (on some distros) a wrapper-mangled .blueman-manager-wrapped.
leave   ^(org\.pulseaudio\.)?[Pp]avucontrol$
leave   ^\.?[Bb]lueman-manager(-wrapped)?$

# --- Always maximize -------------------------------------------------------
# App FAMILIES, so a browser or terminal you install next month is right the
# first time you open it. One-off classes belong in window-policy.local.conf.
#
# Note the anchors do real work here: ^signal$ is Signal's main window, while
# signal-desktop is its little notification popup — matching loosely would
# maximize the popup too.

# Browsers
always  ^(firefox|firefox-esr|librewolf|waterfox|zen|zen-browser|Navigator)$
always  ^(chromium|google-chrome|google-chrome-unstable|brave-browser|vivaldi-stable|microsoft-edge)$

# Terminals
always  ^(kitty|alacritty|Alacritty|foot|footclient|org\.wezfurlong\.wezterm|com\.mitchellh\.ghostty)$
always  ^(xterm|UXTerm|XTerm|org\.gnome\.Terminal|konsole)$

# Mail, calendar, office
always  ^(org\.mozilla\.)?[Tt]hunderbird$
always  ^libreoffice-.*$

# Editors and IDEs
always  ^(code|code-oss|codium|VSCodium|jetbrains-.*)$
always  ^(org\.gnome\.gedit|org\.gnome\.TextEditor|org\.kde\.kate)$

# Things that are simply unusable small
always  ^(gimp|gimp-.*|org\.gimp\.GIMP|org\.inkscape\.Inkscape|inkscape)$
always  ^(org\.kde\.kdenlive|com\.obsproject\.Studio|org\.audacityteam\.Audacity)$

# Chat — long-running windows you keep on a workspace of their own
always  ^(signal|org\.telegram\.desktop|whatsdesk|element|discord|Slack)$

# --- Apps with many main windows -------------------------------------------
# Browsers only, deliberately. Everything else is better served by the
# one-window rule, which needs no per-app knowledge — and every class listed
# here has to have its non-main windows enumerated below, which is exactly the
# maintenance this config is trying not to have. Add your own (a terminal, an
# editor — anything with no dialogs of its own, where the list below stays
# empty) to window-policy.local.conf.
multi   ^(firefox|firefox-esr|librewolf|waterfox|zen|zen-browser|Navigator)$
multi   ^(chromium|google-chrome|google-chrome-unstable|brave-browser|vivaldi-stable|microsoft-edge)$

# --- …and their windows that aren't main windows ---------------------------
# Titles, matched anchored, and ONLY for a `multi` class above. The anchors do
# the real work: a page called "Library" comes through as `Library — Waterfox`
# and doesn't match `^Library$`, so a browsing window can't be mistaken for the
# bookmarks window. The About rule names the browsers for the same reason —
# `^About.*` would swallow a page titled "About us".
popup   ^(Library|Picture-in-Picture|Picture in picture|.* Sharing Indicator)$
popup   ^Extension: .*$                         # extension detached into a window
popup   ^About ([A-Z][a-z]+ )?(Firefox|Waterfox|LibreWolf|Zen Browser|Chromium|Chrome|Brave|Vivaldi|Edge)( Nightly)?$
