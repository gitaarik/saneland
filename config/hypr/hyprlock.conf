# ~/.config/hypr/hyprlock.conf
#
# Minimal lock screen — blurred screenshot background, clock, password input.
#
# MULTI-MONITOR: an empty `monitor =` on a widget means EVERY screen, so each
# display gets its own full copy of the clock, the date and the password box.
# That's the right default (you can unlock from whichever screen you're looking
# at, and it can't hide the input on a monitor that's off), but with three
# screens it is a lot of clocks. To put the widgets on one screen and leave the
# rest showing just the blurred background, name a connector on each widget:
#
#   monitor = eDP-1
#
# `hyprctl monitors | grep Monitor` lists the names. Do it in a copy of this
# file at local/hypr/hyprlock.conf rather than here — connector names are
# machine-specific, and hyprlock has no `source =`, so the whole-file overlay
# is the only override mechanism it has. See docs/CUSTOMIZING.md § Mechanism 2.
# Leave `background` on all monitors either way, or the unnamed screens go
# black.

general {
    hide_cursor = true
}

# `disable_loading_bar`, `grace` and `no_fade_in` used to live in the block
# above. hyprlock 0.9 dropped them as config options — they're command-line
# flags now (`--grace N`, `--no-fade-in`, `--immediate-render`), and left in
# here they only produce "config option does not exist" errors on every lock.
# grace defaults to 0, so nothing was lost. To pass flags, override the
# launcher in ~/.config/hypr/local.conf:  $lock = hyprlock --no-fade-in

# Blurred screenshot of whatever was on screen when locked.
# Swap `path = screenshot` for a wallpaper file (e.g. theme/dark/wallpaper.jpg)
# if you want a fixed lock image.
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
}

# Clock — large HH:MM.
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(235, 219, 178, 1.0)
    font_size = 64
    font_family = Noto Sans
    position = 0, 100
    halign = center
    valign = center
}

# Date — small, under the clock.
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %B %d")"
    color = rgba(235, 219, 178, 0.8)
    font_size = 18
    font_family = Noto Sans
    position = 0, 40
    halign = center
    valign = center
}

# Password input — single line, dots.
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.3
    dots_spacing = 0.3
    outer_color = rgba(40, 40, 40, 0.9)
    inner_color = rgba(60, 56, 54, 0.6)
    font_color = rgb(235, 219, 178)
    fade_on_empty = false
    placeholder_text = <i>Password</i>
    position = 0, -100
    halign = center
    valign = center
}
