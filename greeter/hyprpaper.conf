# saneland — greeter wallpaper daemon.
#
# Installed to /etc/greetd/hyprpaper.conf; started by the greeter's
# hyprland.conf with `hyprpaper -c` pointing here.
#
# As in the session config, this file deliberately sets NO wallpaper.
# hyprpaper 0.8.4 (the hyprtoolkit rewrite) ignores the `wallpaper =` and
# `preload =` directives in its config entirely and never paints at startup —
# only `hyprctl hyprpaper wallpaper ,<path>` works. That call lives in
# /etc/greetd/saneland-greeter-wallpaper, which waits for the IPC socket to
# come up first. All this file has to do is enable IPC.

ipc = on
splash = false
