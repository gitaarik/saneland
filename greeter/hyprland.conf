# saneland — greeter compositor, the login screen's Hyprland instance.
#
# Installed to /etc/greetd/hyprland.conf by greeter/install.sh. This is NOT
# your session config: it runs as the unprivileged `greeter` user, has no bar,
# no keybinds and no plugins, and exists only to put the ReGreet login window
# on ONE screen with a wallpaper on the others.
#
# WHY THIS EXISTS AT ALL. The stock greetd setup runs `cage -s -- regreet`,
# and cage's multi-output default is `-m extend`: every connected output is
# welded into a single logical surface, so the fullscreen login window spans
# all of them and the password box lands on the seam between two monitors.
# Cage's only alternative, `-m last`, drives whichever output was connected
# last — not selectable, and usually the external one — and blanks the rest.
# Hyprland gives us actual monitor rules instead, plus the correct mode and
# scale for each display (cage runs everything at its EDID-preferred mode, so
# a TV that prefers 4K30 renders the greeter at 30Hz).

# --- outputs ---------------------------------------------------------------
# Fallback for any output not named in machine.conf: native mode, auto-placed
# to the right, unscaled. Same wildcard the session config uses.
monitor = , preferred, auto, 1

# Generated by greeter/install.sh from your ~/.config/hypr/local.conf: the
# `monitor =` lines (so the greeter gets the same modes, scales and layout as
# your session), your keyboard layout, and $main_monitor — the screen the
# login window goes on. Sourced AFTER the wildcard above so it wins.
#
# It's regenerated on every install.sh run; re-run it when you change monitors.
source = /etc/greetd/machine.conf

# --- the greeter itself ----------------------------------------------------
exec-once = hyprpaper -c /etc/greetd/hyprpaper.conf
exec-once = /etc/greetd/saneland-greeter-wallpaper

# `; hyprctl dispatch exit` is load-bearing. ReGreet hands the session off to
# greetd and quits; without this the compositor would keep running with no
# window, and greetd would sit there waiting for its greeter to exit instead of
# starting your session.
exec-once = regreet; hyprctl dispatch exit

# --- put the login window on ONE screen ------------------------------------
# GTK4 reports ReGreet's app_id as `apps.regreet`; the alternatives are matched
# too in case a build sets a plainer one. $main_monitor comes from machine.conf.
#
# fullscreen, not floating: ReGreet lays its widgets out against the whole
# screen — floated it collapses to a clipped box — so the window covers its
# monitor entirely. It's transparent (regreet.css), so hyprpaper's wallpaper
# shows through it here and stays visible on every other screen.
$greeter_class = ^(apps\.regreet|regreet|ReGreet)$
windowrule = monitor $main_monitor, match:class $greeter_class
windowrule = fullscreen 1, match:class $greeter_class

# --- strip the desktop down ------------------------------------------------
# No animations (nothing to animate), no borders or gaps or rounding around the
# single fullscreen window, and none of Hyprland's stock branding — with no
# wallpaper daemon of its own it would otherwise draw a random bundled image.
general {
    border_size = 0
    gaps_in = 0
    gaps_out = 0
}

decoration {
    rounding = 0
    blur {
        enabled = false
    }
}

animations {
    enabled = false
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    disable_autoreload = true          # nothing edits this file while it runs

    # Since 0.55 Hyprland warns on screen when it wasn't launched through
    # `start-hyprland`, its watchdog wrapper. Your session does go through it
    # (uwsm runs start-hyprland); the greeter deliberately doesn't. The
    # watchdog's job is to restart a compositor that died unexpectedly, and
    # this one is *supposed* to die — `hyprctl dispatch exit` below is how it
    # hands you over to your session. Worse, if it ever failed to come up the
    # watchdog would keep restarting it, where today greetd gives up and drops
    # you at a text console. So: no watchdog, and no warning about it.
    disable_watchdog_warning = true
}

# Ctrl+Alt+F<n> VT switching is handled by the session backend, not by a bind,
# so it keeps working here — that's your way out to a text console if the
# greeter ever fails to come up.
