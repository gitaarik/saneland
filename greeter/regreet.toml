# saneland — ReGreet (the login UI itself). Installed to /etc/greetd/regreet.toml
# by greeter/install.sh, which backs up whatever was there first.
#
# NO [background] SECTION, ON PURPOSE. The wallpaper behind the login window is
# hyprpaper's — it paints every output, including the one holding ReGreet — and
# regreet.css next to this file makes ReGreet's own window transparent so it
# shows through. That's the same "one continuous desktop" look a [background]
# would give, without the cost:
#
# ReGreet loads a background with gtk_media_file_new_for_filename(), i.e. it
# runs even a still JPEG through a GStreamer *video* pipeline. That spawns a
# GstPlay thread, two gldisplay-event threads and a gstglcontext thread. When
# ReGreet exits after handing your session to greetd, its main thread's exit()
# tears Mesa down while that GL thread is still running its own main loop, and
# regreet segfaults on the way out — harmless (you're already logged in) but it
# dumps core on every login.

skip_selection = false

[appearance]
greeting_msg = "Welcome back!"

[GTK]
application_prefer_dark_theme = true
theme_name = "Adwaita-dark"
icon_theme_name = "Adwaita"
cursor_theme_name = "Adwaita"
font_name = "Cantarell 14"

[commands]
reboot = [ "systemctl", "reboot" ]
poweroff = [ "systemctl", "poweroff" ]
